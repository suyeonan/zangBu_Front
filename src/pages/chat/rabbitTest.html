<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>STOMP WebSocket Test – 멀티 구독</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CDN: @stomp/stompjs (UMD) -->
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 900px;
        margin: 20px auto;
      }
      input,
      button {
        padding: 8px;
      }
      .row {
        margin: 8px 0;
        display: flex;
        gap: 8px;
      }
      textarea {
        width: 100%;
        height: 160px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border: 1px solid #ddd;
        border-radius: 20px;
        margin: 4px;
      }
      .pill code {
        background: #f6f6f6;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .muted {
        color: #666;
      }
    </style>
  </head>
  <body>
    <h2>STOMP WebSocket Test (순수 WS + CONNECT 헤더 JWT / 멀티 구독)</h2>

    <div class="row">
      <label style="width: 120px">WS URL</label>
      <input id="wsUrl" value="ws://localhost:8080/chat" style="flex: 1" />
    </div>
    <div class="row">
      <label style="width: 120px">JWT</label>
      <input id="jwt" placeholder="Bearer 없이 토큰만" style="flex: 1" />
    </div>
    <div class="row">
      <button id="btnConnect">Connect</button>
      <button id="btnDisconnect">Disconnect</button>
      <span id="status" class="muted" style="margin-left: 12px">DISCONNECTED</span>
    </div>

    <hr />

    <h3>Subscribe (다중 구독 가능)</h3>
    <div class="row">
      <input id="subDest" value="/topic/test" style="flex: 1" />
      <button id="btnSubAdd">Add Subscribe</button>
      <button id="btnUnsubAll">Unsubscribe All</button>
    </div>

    <div id="subsList" class="muted" style="padding: 6px 0">
      <!-- 현재 구독 목록이 pill로 표시됨 -->
    </div>

    <textarea id="recv" placeholder="수신 메시지 로그" readonly></textarea>

    <h3>Send</h3>
    <div class="row">
      <input id="sendDest" value="/app/chat.send/${roomId}" style="flex: 1" />
    </div>
    <div class="row">
      <input id="chatRoomId" placeholder="test-room" />
      <input id="message" placeholder="메시지" style="flex: 1" />
      <button id="btnSend">Send</button>
    </div>

    <script>
      let client = null
      // destination -> { sub: StompSubscription, createdAt: Date }
      const subscriptions = new Map()

      const el = (id) => document.getElementById(id)
      const logRecv = (msg) => {
        const ta = el('recv')
        ta.value += `[${new Date().toLocaleTimeString()}] ${msg}\n`
        ta.scrollTop = ta.scrollHeight
      }

      function renderSubs() {
        const container = el('subsList')
        container.innerHTML = ''
        if (subscriptions.size === 0) {
          container.textContent = '현재 구독 없음'
          return
        }
        subscriptions.forEach((info, dest) => {
          const pill = document.createElement('span')
          pill.className = 'pill'
          const label = document.createElement('code')
          label.textContent = dest
          const btn = document.createElement('button')
          btn.textContent = 'Unsub'
          btn.onclick = () => unsubscribeOne(dest)
          pill.appendChild(label)
          pill.appendChild(btn)
          container.appendChild(pill)
        })
      }

      function connect() {
        const url = el('wsUrl').value.trim()
        const token = el('jwt').value.trim()
        if (!url) return alert('WS URL 입력')
        if (!token) return alert('JWT 입력')

        client = new StompJs.Client({
          brokerURL: url,
          reconnectDelay: 0,
          heartbeatIncoming: 0,
          heartbeatOutgoing: 0,
          connectHeaders: { Authorization: 'Bearer ' + token },
          onConnect: () => {
            el('status').textContent = 'CONNECTED'
            logRecv('CONNECTED')
          },
          onStompError: (frame) => {
            el('status').textContent = 'ERROR'
            console.error('STOMP ERROR:', frame)
            logRecv('STOMP ERROR: ' + JSON.stringify(frame.headers || {}))
          },
          onWebSocketClose: () => {
            el('status').textContent = 'CLOSED'
            logRecv('WebSocket closed')
          },
        })
        client.activate()
        el('status').textContent = 'CONNECTING...'
      }

      function disconnect() {
        unsubscribeAll()
        if (client) {
          client.deactivate()
          client = null
        }
        el('status').textContent = 'DISCONNECTED'
        logRecv('Disconnected')
      }

      function addSubscribe() {
        if (!client || !client.connected) return alert('먼저 Connect')
        const dest = el('subDest').value.trim()
        if (!dest) return alert('구독 destination 입력')

        if (subscriptions.has(dest)) {
          logRecv(`이미 구독 중: ${dest}`)
          return
        }

        const sub = client.subscribe(dest, (message) => {
          try {
            logRecv(`MESSAGE ${dest}: ${message.body}`)
          } catch (e) {
            logRecv(`MESSAGE ${dest}: [parse error] ${e}`)
          }
        })

        subscriptions.set(dest, { sub, createdAt: new Date() })
        logRecv('SUBSCRIBE ' + dest)
        renderSubs()
      }

      function unsubscribeOne(dest) {
        const info = subscriptions.get(dest)
        if (info) {
          try {
            info.sub.unsubscribe()
          } catch {}
          subscriptions.delete(dest)
          logRecv('UNSUBSCRIBE ' + dest)
          renderSubs()
        }
      }

      function unsubscribeAll() {
        subscriptions.forEach((info, dest) => {
          try {
            info.sub.unsubscribe()
          } catch {}
        })
        subscriptions.clear()
        renderSubs()
        logRecv('UNSUBSCRIBE ALL')
      }

      function sendMsg() {
        if (!client || !client.connected) return alert('먼저 Connect')
        const destTemplate = el('sendDest').value.trim()
        const chatRoomId = el('chatRoomId').value.trim()
        const message = el('message').value.trim()
        if (!destTemplate) return alert('보낼 destination 입력')

        // 사용자가 표시용으로 가진 템플릿은 그대로 두고, 실제 publish는 roomId를 경로에만 붙임
        const realDest = `/app/chat.send/${chatRoomId || ''}`

        client.publish({
          destination: realDest,
          body: JSON.stringify({ message }),
          headers: { 'content-type': 'application/json;charset=UTF-8' },
        })
        logRecv(`SEND ${realDest} : ${message}`)
      }

      el('btnConnect').onclick = connect
      el('btnDisconnect').onclick = disconnect
      el('btnSubAdd').onclick = addSubscribe
      el('btnUnsubAll').onclick = unsubscribeAll
      el('btnSend').onclick = sendMsg
    </script>
  </body>
</html>
